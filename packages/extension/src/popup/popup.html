<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="icons/icon-32.png" />
    <link rel="stylesheet" href="theme.css" />
    <title>图片抓取器</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        /* 设计高度 600，但窗口内容区更矮时跟随实际视口，避免底栏被裁 */
        min-height: min(600px, 100vh);
        overflow: hidden;
        background: var(--canvas);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter",
          "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
        color-scheme: light dark;
      }
      html {
        width: 100%;
        background: var(--canvas);
      }
      /* 382px 是弹窗的首选宽度（Chrome 据此定窗口），窄窗口下由 max-width 收回 */
      body {
        width: 382px;
        max-width: 100%;
        min-width: 0;
      }
      #app {
        display: flex;
        width: 100%;
        max-width: 100%;
        height: 100%;
        min-height: 0;
        min-width: 0;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="popup.js"></script>
  </body>
</html>
