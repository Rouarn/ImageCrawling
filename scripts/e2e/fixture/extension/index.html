<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>扩展测试图集 · Summer</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 24px;
        color: #14161c;
      }
      .grid {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin: 16px 0;
      }
      .grid img {
        width: 120px;
        height: 120px;
        object-fit: cover;
        border-radius: 8px;
        background: #eceef3;
      }
      .bg-inline,
      .bg-css {
        width: 120px;
        height: 120px;
        border-radius: 8px;
        background-size: cover;
        font-size: 11px;
        color: #fff;
        padding: 6px;
      }
      .bg-css {
        background-image: url("/img/photo-a.jpg?css=1");
      }
    </style>
  </head>
  <body>
    <h1>扩展测试图集</h1>
    <p>覆盖普通 img、srcset、懒加载 data-src、picture、内联背景、样式表背景，以及 800ms 后插入的新图。</p>

    <div class="grid">
      <img src="/img/photo-a.jpg" alt="普通图片" />
      <img
        src="/img/photo-b.jpg"
        srcset="/img/photo-b.jpg 640w, /img/photo-c.jpg 1080w"
        alt="srcset 图片"
      />
      <img src="/img/fake.jpg" data-src="/img/photo-b.jpg?lazy=1" alt="懒加载图片" />
      <picture>
        <source srcset="/img/photo-a.jpg?pic=1" />
        <img src="/img/photo-b.jpg?pic=1" alt="picture 图片" />
      </picture>
      <div
        class="bg-inline"
        style="background-image: url('/img/photo-c.jpg?bg=1')"
      >
        内联背景
      </div>
      <div class="bg-css">样式表背景</div>
    </div>

    <button type="button" id="more">加载更多</button>

    <script>
      setTimeout(function () {
        var img = document.createElement('img');
        img.src = '/img/photo-a.jpg?fresh=1';
        img.alt = '后来插入的图片';
        img.style.width = '120px';
        img.style.height = '120px';
        img.style.objectFit = 'cover';
        img.style.borderRadius = '8px';
        document.querySelector('.grid').appendChild(img);
      }, 800);
    </script>
  </body>
</html>
